# ============================================================
# SafeFusion 配置示例 —— 复制为 config.yaml 后按需修改
# 加载顺序：内置默认值 → 本文件 YAML 覆盖 → 环境变量覆盖
# 密钥类配置一律通过环境变量注入（见下方 api_key_env 说明），
# 本文件严禁填写真实密钥；即使写了 api_key 键也会被忽略并告警。
# 通用标量覆盖示例：SAFEFUSION_THRESHOLDS_SEMANTIC_THRESHOLD=0.7
# 密钥覆盖示例：SAFEFUSION_LLM_API_KEY=xxx / SAFEFUSION_EMBEDDING_API_KEY=xxx
# ============================================================

# ---- 服务 ----
server:
  host: "0.0.0.0"          # 审核 API 监听地址（默认 0.0.0.0）
  port: 8000               # 审核 API 端口（:8000）
  admin_port: 8001         # 管理 API 端口（:8001）

# ---- 数据目录 ----
# 运行时数据（audit.db、词库、向量库、模型缓存等）统一存放；
# 相对路径基于进程启动目录解析。该目录已被 gitignore，不提交 git。
data_dir: "./data"

# ---- 阈值（默认值来自 PRD §3.4 / 分工文档，上线后按真实数据校准）----
thresholds:
  semantic_threshold: 0.67       # 语义层判定违规的相似度阈值
  margin_w: 0.05                 # 黑均分 − 白均分差值与 margin 比较基准
  black_white_gap: 0.02          # 黑顶分−白顶分最小差距（黑未显著更接近白时不判违规）
  confidence_low: 0.35           # 置信度低档上界：低于此值判定安全
  confidence_high: 0.75          # 置信度高档下界：高于此值判定违规
  phash_whitelist_distance: 5    # 图片白名单 pHash 汉明距离阈值
  phash_dedup_distance: 3        # 图片去重缓存近似命中 pHash 阈值
  top_k: 5                       # 语义检索 Top-K（黑/白库默认召回数）
  black_top_k: null              # 黑库独立 Top-K；null 跟随 top_k
  white_top_k: null              # 白库独立 Top-K；null 跟随 top_k

# ---- Embedding（双后端：本地 Chinese-CLIP 默认 / 云端 API 可配；支持多 provider + 多向量库）----
embedding:
  backend: "local"               # local | cloud
  local:
    model_name: "OFA-Sys/chinese-clip-vit-base-patch16"  # HF 模型名或本地路径
    weights_path: null           # 本地权重目录（内网/离线时指定；null 用 HF 缓存）
    device: "auto"               # auto（有 GPU 用 GPU，否则 CPU）| cpu | cuda
  cloud:
    base_url: null               # 云端 Embedding API base_url，如 https://api.openai.com/v1
    model: null                  # 云端 embedding 模型名
    api_key_env: null            # 云端 Key 所在环境变量名；null 时仅认 SAFEFUSION_EMBEDDING_API_KEY
    allow_no_key: false          # 本地无鉴权服务（llama.cpp --embeddings）可置 true 免 Key
    image_protocol: "openai"     # openai（默认，/v1/embeddings+input+data URI）| llamacpp（llama.cpp 多模态专用 /embeddings+content+multimodal_data）
    image_max_side: 1024         # 云端图片发送前最长边缩放上限（px）；0 不缩放
    image_quality: 85            # 云端图片 JPEG 压缩质量（1~95）
  # 多提供者（可选；providers 为空时使用上方 backend/local/cloud 单后端）
  providers: []
  # 手动指定首选 provider 名称（providers 非空时生效）
  active_provider: null
  # 多提供者失败切换/熔断参数（PRD v0.4.0 M3）
  failover:
    enabled: true
    cooldown_seconds: 30
    max_failures: 3
  # 多向量库映射：每个向量库有唯一 name + 相对 data_dir 的目录。
  # provider 通过 vector_store 字段指定使用哪个库；未指定则用默认库 data/vectors。
  # 注意：启动只登记路径，按需懒加载，不会一次性把所有大库读进内存。
  vector_stores:
    # - name: "wemm"
    #   path: "vectors/wemm"
    # - name: "clip"
    #   path: "vectors/clip"
  # provider 示例（每个 provider 可指定 vector_store）：
  # providers:
  #   - name: "local-clip"
  #     backend: "local"
  #     local:
  #       model_name: "OFA-Sys/chinese-clip-vit-base-patch16"
  #       device: "auto"
  #     vector_store: "clip"
  #     priority: 1
  #   - name: "cloud-wemm"
  #     backend: "cloud"
  #     cloud:
  #       base_url: "http://127.0.0.1:5546/v1"
  #       model: "WeMM-Embedding-2B-Q4_K_M.gguf"
  #       allow_no_key: true
  #       image_protocol: "llamacpp"
  #       image_max_side: 1024
  #     vector_store: "wemm"
  #     priority: 2

# ---- LLM 兜底（OpenAI 兼容；支持多 provider + 失败切换）----
llm:
  base_url: "https://api.openai.com/v1"   # OpenAI 兼容服务地址
  model: "gpt-4o-mini"                    # 兜底模型名
  api_key_env: "OPENAI_API_KEY"           # Key 所在环境变量名；也认 SAFEFUSION_LLM_API_KEY
  timeout: 3                              # 单次调用超时（秒，PRD §3.5）
  max_retry: 1                            # JSON 输出解析失败重试次数
  short_text_max_length: 20               # 短文本 LLM 缓存判定的文本长度上限
  # 多提供者（可选；providers 为空时使用上方单后端兼容模式）
  providers: []
  active_provider: null                   # 手动指定首选 provider 名称
  failover:
    enabled: true
    cooldown_seconds: 30
    max_failures: 3

# ---- Rerank 多提供者（PRD v0.4.0 M2；开关在 semantic.rerank_enabled）----
# providers 为空且 semantic.rerank_enabled=true 时，回退现有 LocalClipRerank。
rerank:
  providers: []
  active_provider: null
  failover:
    enabled: true
    cooldown_seconds: 30
    max_failures: 3
  # provider 示例：
  # providers:
  #   - name: "local-clip"
  #     type: "local"
  #     priority: 1
  #   - name: "cloud-jina"
  #     type: "cloud"
  #     base_url: "https://api.example.com/v1"
  #     model: "jina-reranker-v2-base-multilingual"
  #     api_key_env: "JINA_API_KEY"
  #     priority: 2

# ---- 缓存层（五级，全部进程内；容量 = 最大条目数，ttl = 秒）----
cache:
  audit_cache:                # ① 审核缓存：完整键（文本哈希 + 帧哈希 + 关键参数）
    enabled: true
    capacity: 2000
    ttl: 3600
  high_freq_cache:            # ② 高频缓存：无上下文请求（LRU + TTL）
    enabled: true
    capacity: 1000
    ttl: 300
  dedup_cache:                # ③ 图片去重缓存：仅「单图无文本」请求（MD5 精确 + pHash 近似）
    enabled: true
    capacity: 5000
    ttl: 86400
  short_text_llm_cache:       # ④ 短文本 LLM 缓存
    enabled: true
    capacity: 2000
    ttl: 86400
  permanent_lists: true       # ⑤ 永久黑白名单：启动时从 SQLite 加载，管理端写入即失效

# ---- 轻量文本风险模型（复用已训 fasttext.pt）----
light_model:
  model_path: null            # fasttext.pt 路径；null = 未启用（组件 disabled，不抛异常）
  config_path: null           # 模型配套 config.json 路径；null = 未启用
  # 启用示例（复用 cherry 文本分类训练产物，路径按实际部署位置调整）：
  #   model_path: "data/models/fasttext.pt"
  #   config_path: "data/models/config.json"
  # 说明：ML 环境就绪后（uv sync --extra ml），把
  #   开发/cherry文本分类/部署/model/{fasttext.pt,config.json} 拷入 data/models/（推荐，data/ 已 gitignore），
  #   或直接指向原路径；重启服务后轻量层随语义检索一并启用。

# ---- 日志 ----
logging:
  level: "INFO"               # DEBUG / INFO / WARNING / ERROR
  json_lines: true            # true = JSON 行格式（ts/level/logger/message）；false = 标准文本格式