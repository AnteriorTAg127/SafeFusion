# ============================================================
# SafeFusion 配置示例 —— 复制为 config.yaml 后按需修改
# 加载顺序：内置默认值 → 本文件 YAML 覆盖 → 环境变量覆盖
# 密钥类配置一律通过环境变量注入（见下方 api_key_env 说明），
# 本文件严禁填写真实密钥；即使写了 api_key 键也会被忽略并告警。
# 通用标量覆盖示例：SAFEFUSION_THRESHOLDS_SEMANTIC_THRESHOLD=0.7
# 密钥覆盖示例：SAFEFUSION_LLM_API_KEY=xxx / SAFEFUSION_EMBEDDING_API_KEY=xxx
# ============================================================

# ---- 服务 ----
server:
  host: "0.0.0.0"          # 审核 API 监听地址（默认 0.0.0.0）
  port: 8000               # 审核 API 端口（:8000）
  admin_port: 8001         # 管理 API 端口（:8001）

# ---- 数据目录 ----
# 运行时数据（audit.db、词库、向量库、模型缓存等）统一存放；
# 相对路径基于进程启动目录解析。该目录已被 gitignore，不提交 git。
data_dir: "./data"

# ---- 阈值（默认值来自 PRD §3.4 / 分工文档，上线后按真实数据校准）----
thresholds:
  semantic_threshold: 0.67       # 语义层判定违规的相似度阈值
  margin_w: 0.05                 # 黑均分 − 白均分差值与 margin 比较基准
  confidence_low: 0.35           # 置信度低档上界：低于此值判定安全
  confidence_high: 0.75          # 置信度高档下界：高于此值判定违规
  phash_whitelist_distance: 5    # 图片白名单 pHash 汉明距离阈值
  phash_dedup_distance: 3        # 图片去重缓存近似命中 pHash 阈值

# ---- Embedding（双后端：本地 Chinese-CLIP 默认 / 云端 API 可配）----
embedding:
  backend: "local"               # local | cloud
  local:
    model_name: "OFA-Sys/chinese-clip-vit-base-patch16"  # HF 模型名或本地路径
    weights_path: null           # 本地权重目录（内网/离线时指定；null 用 HF 缓存）
    device: "auto"               # auto（有 GPU 用 GPU，否则 CPU）| cpu | cuda
  cloud:
    base_url: null               # 云端 Embedding API base_url，如 https://api.openai.com/v1
    model: null                  # 云端 embedding 模型名
    api_key_env: null            # 云端 Key 所在环境变量名；null 时仅认 SAFEFUSION_EMBEDDING_API_KEY

# ---- LLM 兜底（OpenAI 兼容）----
llm:
  base_url: "https://api.openai.com/v1"   # OpenAI 兼容服务地址
  model: "gpt-4o-mini"                    # 兜底模型名
  api_key_env: "OPENAI_API_KEY"           # Key 所在环境变量名；也认 SAFEFUSION_LLM_API_KEY
  timeout: 3                              # 单次调用超时（秒，PRD §3.5）
  max_retry: 1                            # JSON 输出解析失败重试次数
  short_text_max_length: 20               # 短文本 LLM 缓存判定的文本长度上限

# ---- 缓存层（五级，全部进程内；容量 = 最大条目数，ttl = 秒）----
cache:
  audit_cache:                # ① 审核缓存：完整键（文本哈希 + 帧哈希 + 关键参数）
    enabled: true
    capacity: 2000
    ttl: 3600
  high_freq_cache:            # ② 高频缓存：无上下文请求（LRU + TTL）
    enabled: true
    capacity: 1000
    ttl: 300
  dedup_cache:                # ③ 图片去重缓存：仅「单图无文本」请求（MD5 精确 + pHash 近似）
    enabled: true
    capacity: 5000
    ttl: 86400
  short_text_llm_cache:       # ④ 短文本 LLM 缓存
    enabled: true
    capacity: 2000
    ttl: 86400
  permanent_lists: true       # ⑤ 永久黑白名单：启动时从 SQLite 加载，管理端写入即失效

# ---- 轻量文本风险模型（复用已训 fasttext.pt）----
light_model:
  model_path: null            # fasttext.pt 路径；null = 未启用（组件 disabled，不抛异常）
  config_path: null           # 模型配套 config.json 路径；null = 未启用

# ---- 日志 ----
logging:
  level: "INFO"               # DEBUG / INFO / WARNING / ERROR
  json_lines: true            # true = JSON 行格式（ts/level/logger/message）；false = 标准文本格式