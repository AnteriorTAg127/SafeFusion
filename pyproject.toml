[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safefusion"
version = "0.1.0"
description = "SafeFusion —— 语义检索 + 关键词规则双通道融合的多模态违规内容识别引擎"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0" }
keywords = ["content-moderation", "semantic-search", "keyword-rule", "multimodal", "audit"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# 核心依赖：审核服务运行必需
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "numpy>=1.24",
    "pyahocorasick>=2.1",
    "pypinyin>=0.51",
    "openai>=1.0",
    "httpx>=0.27",
    "pillow>=10.0",
    "imagehash>=4.3",
    "python-multipart>=0.0.9",
]

# 本地 CLIP 与 fasttext 推理用（体积大、按需安装）：pip install -e ".[ml]"
[project.optional-dependencies]
ml = [
    "torch>=2.0",
    "transformers>=4.40",
]

[tool.setuptools.packages.find]
where = ["src"]

# 开发依赖组（uv sync 默认安装）
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

# pytest 配置（T13 测试专项追加，仅本段，不触碰其它配置段）
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 需要真实模型 / 网络 / 云端服务的集成测试（默认不运行）",
]
# 默认排除 integration 用例：.venv\Scripts\python.exe -m pytest
addopts = "-m 'not integration'"
asyncio_mode = "auto"